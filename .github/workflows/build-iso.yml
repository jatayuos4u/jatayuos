name: JatayuOS 1.0 Udaan - final release (gated)
on:
  push:
    branches: [main]
    paths: [.github/trigger-build-20260929.txt]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to spend runner minutes on one JatayuOS 1.0 Udaan final-version ISO'
        required: true
        type: string
      precheck_only:
        description: Run precheck only without compiling or assembling the ISO
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jatayu-single-iso
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'BUILD')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and record exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p out
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE-COMMIT.txt
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Fast source preflight
        run: python3 scripts/preflight.py
      - name: Reclaim disk space and check capacity
        run: |
          echo 'Before cleanup:'
          df -h .
          # This job uses a fresh GitHub-hosted runner. JatayuOS builds inside
          # Debian and does not use these preinstalled host toolchains.
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if test -d "$path"; then
              sudo du -sh "$path"
              sudo rm -rf -- "$path"
            fi
          done
          echo 'After cleanup:'
          df -h .
          test "$(df --output=avail -k . | tail -1)" -gt 22000000
      - name: Build once in Debian 13
        run: |
          mkdir -p out
          docker run --rm --privileged --name jatayu-builder \
            -v "$GITHUB_WORKSPACE:/work" -w /work debian:trixie \
            bash scripts/build.sh ${{ inputs.precheck_only && '--precheck-only' || '' }}
      - name: Upload ISO and reports
        if: success() && inputs.precheck_only != true
        uses: actions/upload-artifact@v4
        with:
          name: JatayuOS-1.0-Udaan-ISO
          path: |
            out/*.iso
            out/SHA256SUMS
            out/SOURCE-COMMIT.txt
            out/*manifest*
            out/DOCUMENT-SHA256SUMS
            out/third-party-notices/
            out/precheck*.txt
            out/*smoke*.png
          compression-level: 0
          retention-days: 1
      - name: Upload build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JatayuOS-build-log
          path: |
            out/build.log
            out/SOURCE-COMMIT.txt
            out/precheck*.txt
          if-no-files-found: ignore
          retention-days: 1

