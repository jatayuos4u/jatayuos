name: Source security checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source syntax and workflow security
        run: python3 scripts/security-check.py
      - name: Exercise privileged helper and user defaults with mocks
        run: |
          python3 -m unittest discover -s tests -p 'test_android_admin.py' -v
          python3 -m unittest discover -s tests -p 'test_user_defaults.py' -v
